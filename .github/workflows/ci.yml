name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache better-sqlite3 prebuilts
        uses: actions/cache@v4
        with:
          path: ~/.npm/_prebuilds
          key: ${{ runner.os }}-prebuilds-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
